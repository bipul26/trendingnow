<!doctype html><html lang="sb_publishable_j4Ud8tP_JiCNQ6wwIjCOEQ_hoAObS0y"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trending Now — Admin</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#08080d;color:#fff}.wrap{max-width:900px;margin:auto;padding:24px}.card{background:#11111a;border:1px solid #292936;border-radius:18px;padding:20px;margin:16px 0}h1{margin-top:0}.muted{color:#aaa}.grid{display:grid;gap:12px}input,textarea,select{width:100%;padding:13px;border-radius:10px;border:1px solid #333;background:#08080d;color:#fff}textarea{min-height:90px}button{border:0;border-radius:10px;padding:12px 16px;background:#9b5cff;color:#fff;font-weight:700}button.secondary{background:#292936}button.danger{background:#d33}.row{display:flex;gap:10px;flex-wrap:wrap}.post{border:1px solid #2a2a35;border-radius:12px;padding:14px;margin-top:10px}.hidden{display:none}.status{padding:10px;border-radius:10px;background:#171722;margin-top:10px}</style></head><body><div class="wrap"><h1>Trending Now — Admin</h1><p class="muted">Login to manage your posts and videos.</p><div id="loginCard" class="card"><h2>Admin Login</h2><div class="grid"><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button id="loginBtn">Login</button></div><div id="loginStatus" class="status hidden"></div></div><div id="panel" class="hidden"><div class="card"><div class="row" style="justify-content:space-between;align-items:center"><h2 id="formTitle">Add Post / Video</h2><button id="logoutBtn" class="secondary">Logout</button></div><div class="grid"><input id="title" placeholder="Title"><textarea id="description" placeholder="Description"></textarea><input id="thumbnail" placeholder="Thumbnail URL"><input id="video" placeholder="Video URL"><select id="category"><option>General</option><option>Trending</option><option>Music</option><option>Sports</option><option>News</option><option>Entertainment</option></select><div class="row"><button id="saveBtn">Add Post</button><button id="cancelBtn" class="secondary hidden">Cancel Edit</button></div><div id="formStatus" class="status hidden"></div></div></div><div class="card"><h2>Your Posts</h2><div id="posts">Loading...</div></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const SUPABASE_URL="PASTE_YOUR_PROJECT_URL_HERE";const SUPABASE_KEY="PASTE_YOUR_PUBLISHABLE_OR_ANON_KEY_HERE";const client=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const $=id=>document.getElementById(id);let editingId=null;function msg(el,text,show=true){el.textContent=text;el.classList.toggle("hidden",!show)}async function checkSession(){const{data:{session}}=await client.auth.getSession();if(session){$("loginCard").classList.add("hidden");$("panel").classList.remove("hidden");loadPosts()}}$("loginBtn").onclick=async()=>{const email=$("email").value.trim(),password=$("password").value;if(!email||!password)return msg($("loginStatus"),"Enter email and password.");const{error}=await client.auth.signInWithPassword({email,password});if(error)return msg($("loginStatus"),error.message);$("loginCard").classList.add("hidden");$("panel").classList.remove("hidden");loadPosts()};$("logoutBtn").onclick=async()=>{await client.auth.signOut();location.reload()};async function loadPosts(){const{data,error}=await client.from("posts").select("*").order("created_at",{ascending:false});if(error){$("posts").textContent=error.message;return}if(!data.length){$("posts").innerHTML='<p class="muted">No posts yet.</p>';return}$("posts").innerHTML=data.map(p=>`<div class="post"><strong>${escapeHtml(p.title)}</strong><div class="muted">${escapeHtml(p.category||"General")}</div><p>${escapeHtml(p.description||"")}</p><div class="row"><button onclick="editPost('${p.id}')">Edit</button><button class="danger" onclick="deletePost('${p.id}')">Delete</button></div></div>`).join("");window.currentPosts=data}function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}window.editPost=id=>{const p=window.currentPosts.find(x=>String(x.id)===String(id));if(!p)return;editingId=id;$("formTitle").textContent="Edit Post";$("saveBtn").textContent="Update Post";$("cancelBtn").classList.remove("hidden");$("title").value=p.title||"";$("description").value=p.description||"";$("thumbnail").value=p.thumbnail_url||"";$("video").value=p.video_url||"";$("category").value=p.category||"General";scrollTo({top:0,behavior:"smooth"})};window.deletePost=async id=>{if(!confirm("Delete this post?"))return;const{error}=await client.from("posts").delete().eq("id",id);if(error)return alert(error.message);loadPosts()};$("saveBtn").onclick=async()=>{const payload={title:$("title").value.trim(),description:$("description").value.trim(),thumbnail_url:$("thumbnail").value.trim(),video_url:$("video").value.trim(),category:$("category").value};if(!payload.title)return msg($("formStatus"),"Title is required.");let result;if(editingId)result=await client.from("posts").update(payload).eq("id",editingId);else result=await client.from("posts").insert(payload);if(result.error)return msg($("formStatus"),result.error.message);resetForm();loadPosts();msg($("formStatus"),"Saved successfully.")};$("cancelBtn").onclick=resetForm;function resetForm(){editingId=null;$("formTitle").textContent="Add Post / Video";$("saveBtn").textContent="Add Post";$("cancelBtn").classList.add("hidden");["title","description","thumbnail","video"].forEach(id=>$(id).value="");$("category").value="General"}client.auth.onAuthStateChange((event,session)=>{if(!session&&event==="SIGNED_OUT")location.reload()});checkSession();</script></body></html>
